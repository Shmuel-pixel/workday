<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<title>Shmuel's Workday</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app. Sticky date header, scrolling board (To-Do over Done), fixed tab bar. */
:root{
  --bg:#F3F2F1; --surface:#FFFFFF; --sunk:#EDEBE9; --fg:#201F1E; --muted:#605E5C; --line:#E1DFDD;
  --todo:#0078D4; --todo-soft:#DEECF9; --done:#107C10; --done-soft:#DFF6DD;
  --missed:#C42B1C; --missed-soft:#FDE7E9; --erev:#CA5010; --erev-soft:#FDF0E7;
  --fast:#8764B8; --fast-soft:#EFE9F8; --chm:#038387; --chm-soft:#E0F4F4; --off:#323130; --off-soft:#E1DFDD;
  --past-tint:#E8E6E4; --future-tint:#E9F2FB;
  --display:"Barlow Semi Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --heb:"Frank Ruhl Libre","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1A19; --surface:#252423; --sunk:#201F1E; --fg:#F3F2F1; --muted:#A19F9D; --line:#3B3A39;
  --todo:#479EF5; --todo-soft:#0F2A42; --done:#54B054; --done-soft:#14301A;
  --missed:#F1707B; --missed-soft:#3D1A1D; --erev:#F7894A; --erev-soft:#3A2416;
  --fast:#B4A0FF; --fast-soft:#2B2240; --chm:#33C1C6; --chm-soft:#0F3132; --off:#E1DFDD; --off-soft:#3B3A39;
  --past-tint:#232221; --future-tint:#16212D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1A19; --surface:#252423; --sunk:#201F1E; --fg:#F3F2F1; --muted:#A19F9D; --line:#3B3A39;
  --todo:#479EF5; --todo-soft:#0F2A42; --done:#54B054; --done-soft:#14301A;
  --missed:#F1707B; --missed-soft:#3D1A1D; --erev:#F7894A; --erev-soft:#3A2416;
  --fast:#B4A0FF; --fast-soft:#2B2240; --chm:#33C1C6; --chm-soft:#0F3132; --off:#E1DFDD; --off-soft:#3B3A39;
  --past-tint:#232221; --future-tint:#16212D; color-scheme:dark}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;display:flex;flex-direction:column;touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--todo);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{flex:none;position:relative;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 10px;display:grid;gap:8px}
.toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dates{min-width:0}
.heb{font-family:var(--heb);font-size:22px;font-weight:700;line-height:1.15;direction:rtl;text-align:left;unicode-bidi:plaintext}
.eng{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.01em}
.hebeng{font-size:13px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;font-family:inherit;cursor:pointer;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.k-off{background:var(--off-soft);color:var(--off)} .k-erev{background:var(--erev-soft);color:var(--erev)}
.k-fast{background:var(--fast-soft);color:var(--fast)} .k-chm{background:var(--chm-soft);color:var(--chm)}
.k-us{background:var(--todo-soft);color:var(--todo)} .k-info{background:var(--sunk);color:var(--muted)}
.daynav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.navbtn{height:36px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.navbtn:disabled{opacity:.35}
.status{text-align:center;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:6px;border-radius:8px}
.st-today{background:var(--todo);color:#fff}
.st-past{background:var(--past-tint);color:var(--muted);border:1px dashed var(--muted)}
.st-future{background:var(--future-tint);color:var(--todo);border:1px dashed var(--todo)}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.toptabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px}
.toptabs::-webkit-scrollbar{display:none}
.ttab{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);background:var(--bg)}
.ttab svg{width:18px;height:18px}
.ttab.on{background:var(--todo);border-color:var(--todo);color:#fff}
.cfoot{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fbtn{font-size:13px;font-weight:600;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);display:inline-flex;align-items:center;gap:5px}
.fbtn svg{width:15px;height:15px}
.fbtn.go{color:var(--todo)} .fbtn.ok{color:var(--done)}
.last{grid-column:2 / 4;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.thread{display:grid;gap:8px;background:var(--bg);border-radius:12px;padding:10px;min-height:120px;max-height:46vh;overflow-y:auto}
.bub{justify-self:end;max-width:82%;background:var(--todo);color:#fff;border-radius:16px 16px 4px 16px;padding:8px 11px;display:grid;gap:4px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bub img{border-radius:10px;display:block;max-width:100%}
.bub time{font-size:11px;opacity:.8;justify-self:end}
.tday{justify-self:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.compose{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:end}
.compose textarea{padding:10px 12px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;resize:none;min-width:0;max-height:120px}
.photo{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--todo);cursor:pointer}
.photo svg{width:22px;height:22px}
.send{height:44px;padding:0 16px;border-radius:22px;background:var(--todo);color:#fff;font-weight:700}
.pend{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.pend img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.pend button{color:var(--missed);font-weight:600}

main .wrap{padding-block:14px;display:grid;gap:14px}
main.tint-past{background:var(--past-tint)} main.tint-future{background:var(--future-tint)}
.ask{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--missed);border-radius:10px;padding:12px;display:grid;gap:10px}
.ask p{margin:0} .ask .who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:8px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--todo);color:#fff;border-color:var(--todo)}
.btn.good{background:var(--done);color:#fff;border-color:var(--done)}
.btn.danger{background:var(--missed);color:#fff;border-color:var(--missed)}
.zone{border-radius:12px;padding:10px;display:grid;gap:8px;border:2px solid transparent;transition:border-color .15s,background .15s}
.zone.todo{background:var(--todo-soft)} .zone.done{background:var(--done-soft)} .zone.missed{background:var(--missed-soft)}
.zone.hot{border-color:var(--fg)}
.zhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.zhead h2{margin:0;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.todo h2{color:var(--todo)} .done h2{color:var(--done)} .missed h2{color:var(--missed)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.add{width:34px;height:34px;border-radius:8px;background:var(--todo);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center}
.empty{font-size:13px;color:var(--muted);padding:6px 4px}
.card{background:var(--surface);border-radius:10px;padding:10px 10px 10px 4px;display:grid;grid-template-columns:30px 1fr auto;gap:4px 6px;align-items:start;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card.isdone .ttl{text-decoration:line-through;text-decoration-color:var(--muted)}
.card.dragging{opacity:.35}
.card.swiping{transition:none}
.card.snap{transition:transform .18s ease,background .18s}
.card.sw-done{background:var(--done-soft);box-shadow:inset 5px 0 0 var(--done)}
.card.sw-todo{background:var(--todo-soft);box-shadow:inset -5px 0 0 var(--todo)}
.sum{background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:8px;border:1px solid var(--line)}
.sum summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sum summary::-webkit-details-marker{display:none}
.sum summary span{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sum summary i{font-style:normal;color:var(--muted);font-size:13px;font-weight:600}
.sum[open] summary i::after{content:" hide"}
.sum:not([open]) summary i::after{content:" show"}
.sum[open]{gap:8px}
.sum{padding:10px 12px}
.sumtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sumtop span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sumtop button{font-size:13px;font-weight:600;color:var(--todo)}
.sumhead{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.25}
.sumlines{display:grid;gap:4px;font-size:14px;margin:0;padding:0;list-style:none}
.sumlines li{display:grid;grid-template-columns:84px 1fr;gap:8px}
.sumlines b{color:var(--muted);font-weight:600}
.logsum{font-size:13px;color:var(--fg);background:var(--bg);border-radius:8px;padding:8px 10px}
.tchks{display:flex;flex-wrap:wrap;gap:6px}
.field label.tchk{text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);font-weight:600}
.field label.tchk{display:inline-flex;white-space:nowrap;justify-content:flex-start;padding:6px 11px}
.field .tchk input{width:auto!important;padding:0!important;margin:0;min-height:0;flex:none;border:0}
#thr.thread{min-height:56px}
.tchk{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:600}
.tchk input{accent-color:var(--todo);margin:0}
.tchk:has(input:checked){background:var(--todo-soft);border-color:var(--todo);color:var(--todo)}
.mt{font-size:13px;color:var(--muted)}
.mt b{color:var(--fg);font-weight:600}
.eqbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px}
.eqbar div{display:grid;min-width:0}.eqbar span{font-size:12px;color:var(--muted)}
.eqstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eqstats>*{background:var(--surface);border-radius:10px;padding:10px;display:grid;text-align:left;border:1px solid transparent}
.eqstats b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}.eqstats span{font-size:12px;color:var(--muted)}
.eqstats button b{color:var(--erev)}.eqstats button.on{border-color:var(--erev);background:var(--erev-soft)}
.eqchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.eqchips::-webkit-scrollbar{display:none}
.eqgrp{background:var(--surface);border-radius:12px;overflow:hidden}
.eqgh{display:flex;align-items:baseline;gap:8px;padding:10px 12px;background:var(--sunk)}
.eqgh b{font-family:var(--display);font-size:17px}.eqgh span{font-size:12px;color:var(--muted);flex:1;min-width:0}.eqgh i{font-style:normal;font-size:13px;color:var(--muted)}
.eqrow{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;text-align:left;padding:10px 12px;border-top:1px solid var(--line)}
.eqmain{display:grid;gap:2px;min-width:0}.eqmain small{font-weight:500;color:var(--muted)}
.eqmain span{font-size:13px;color:var(--muted)}.eqmain em{font-style:normal;font-size:12px;font-weight:700;color:var(--erev)}
.eqside{display:grid;justify-items:end;gap:4px;align-content:start}
.qty{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--done-soft);color:var(--done)}.pill.bad{background:var(--missed-soft);color:var(--missed)}.pill.warn{background:var(--erev-soft);color:var(--erev)}.pill.blue{background:var(--todo-soft);color:var(--todo)}.pill.unk{background:var(--sunk);color:var(--muted)}
.tren{font-size:15px;white-space:pre-wrap;margin-bottom:6px}
.lrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 10px;margin-top:4px;color:var(--fg)}
.lrow.light{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:inherit}
.lmain{display:grid;min-width:0;flex:1;color:inherit;text-decoration:none}.lmain b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lmain small{font-size:11px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbtns{display:flex;gap:6px;flex:none}.lbtns button{font-size:12px;font-weight:700;padding:5px 8px;border-radius:8px;background:var(--sunk);color:var(--todo)}
.lrow.light .lbtns button{background:rgba(255,255,255,.22);color:inherit}
.lbox{display:grid;gap:2px}
.lchips{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:6px;margin:2px 0}
.lchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--todo-soft);color:var(--todo);text-decoration:none}
.lchip svg{width:13px;height:13px}
.translit{background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:15px;font-style:italic;display:grid;gap:2px}
.translit small{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.talk{display:grid;justify-items:center;gap:6px;padding:6px 0}
.mic{width:76px;height:76px;border-radius:50%;background:var(--todo);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.mic svg{width:34px;height:34px}
.mic.on{background:var(--missed);animation:micp 1.2s ease-in-out infinite}
.mic.work{background:var(--muted)}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(196,43,28,.45)}50%{box-shadow:0 0 0 14px rgba(196,43,28,0)}}
.wave{display:none;width:100%;max-width:300px;height:56px}
.talk.listening .wave{display:block}
.hear{font-size:14px;color:var(--muted);text-align:center;min-height:20px;max-width:100%}
.bub.ai{justify-self:start;background:var(--sunk);color:var(--fg);border-radius:16px 16px 16px 4px}
.aidone{margin:2px 0 0;padding-left:18px;font-size:14px;display:grid;gap:2px}
.aidone.warnl{color:var(--erev)}
.aiundo{justify-self:start;font-size:13px;font-weight:700;color:var(--todo);padding:2px 0}
.bub.ai small{color:var(--muted);font-size:12px}
.fab{position:fixed;z-index:7;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));height:52px;padding:0 18px;border-radius:26px;background:var(--todo);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab svg{width:30px;height:30px}
#fab{width:64px;height:64px;padding:0;border-radius:50%;justify-content:center}
#printArea{display:none}
.sheetlink{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:8px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--todo);text-decoration:none}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.keyfind input{width:100%;box-sizing:border-box;font-size:22px!important;font-weight:700;padding:14px 16px;border-radius:14px;border:2px solid var(--todo);background:var(--surface);color:var(--fg)}
.keylist{display:grid;gap:6px}
.keyrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:12px;padding:10px 12px;color:var(--fg)}
.keyrow.ret{opacity:.55}
.knum{font-family:var(--display);font-weight:800;font-size:20px;color:var(--todo);min-width:68px;font-variant-numeric:tabular-nums}
.kmain{display:grid;min-width:0;flex:1}.kmain b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kmain small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keybig{display:grid;gap:6px;background:var(--surface);border:2px solid var(--todo);border-radius:16px;padding:14px}
.keybig .knum{font-size:40px}.keybig b{font-size:18px}.keybig a{color:var(--todo)}
.keybig.ret{border-color:var(--missed)}.keybig.ret .knum{color:var(--missed);text-decoration:line-through}
.kretire{color:var(--missed);font-weight:800;letter-spacing:.04em}
.hocode{font-family:var(--display);font-size:52px;font-weight:800;text-align:center;letter-spacing:.06em;color:var(--todo);font-variant-numeric:tabular-nums}
.hoin{width:100%;box-sizing:border-box;text-align:center;font-size:34px!important;font-weight:800;letter-spacing:.12em;padding:12px;border-radius:14px;border:2px solid var(--todo);background:var(--surface);color:var(--fg)}
.newdev{display:grid;gap:6px;background:var(--todo-soft);border-radius:14px;padding:14px}.newdev span{color:var(--muted);font-size:14px}
.stylebtns{display:flex;flex-wrap:wrap;gap:8px}
.wrout{width:100%;box-sizing:border-box;border:0;background:transparent;color:inherit;font:inherit;font-size:17px;resize:vertical;padding:4px 0}
.seg.seg3{grid-template-columns:repeat(3,minmax(0,1fr))!important}

function plural(n,w){return n+' '+w+(n===1?'':'s')}
function summarize(s){
  var list=cardsOn(s),r=rel(s),T=todayStr();
  var done=list.filter(function(c){return c.status==='done'}),open=list.filter(function(c){return c.status==='todo'}),canc=list.filter(function(c){return c.status==='canceled'}),pushed=movedFrom(s);
  var nw=noWork(s),head,lines=[];
  var extra=(pushed.length?', '+pushed.length+' pushed':'')+(canc.length?', '+canc.length+' canceled':'');
  if(!list.length&&pushed.length)return {head:plural(pushed.length,'job')+' pushed to another day.',lines:[['Pushed',pushed.map(function(c){return jobTitle(c)+' to '+engShort(c.date)}).join('; ')]],text:engLong(s)+'\n'+plural(pushed.length,'job')+' pushed to another day.'};
  if(!list.length)return {head:nw?nw+'. No work.':'No jobs on this day.',lines:[],text:(nw?nw+'. No work.':'No jobs on this day.')};
  if(r==='past')head=plural(list.length+pushed.length,'job')+': '+done.length+' done'+extra+(open.length?', '+open.length+' missed':', nothing missed')+'.';
  else if(r==='today'){head=done.length+' of '+plural(list.length-canc.length,'job')+' done so far'+extra+'.';
    var nx=open[0];if(nx)lines.push(['Next',(nx.time?fmtTime(nx.time)+' ':'')+jobTitle(nx)+(nx.address?' at '+nx.address.split(',')[0]:'')+(nx.crew?' ('+nx.crew+')':'')]);}
  else{head=plural(open.length,'job')+' scheduled'+extra+'.';if(open[0]&&open[0].time)lines.push(['First start',fmtTime(open[0].time)+(open[0].address?' at '+open[0].address.split(',')[0]:'')]);}
  if(pushed.length)lines.push(['Pushed',pushed.map(function(c){return jobTitle(c)+' to '+engShort(c.date)+(c.status==='done'?' (done)':'')}).join('; ')]);
  if(canc.length)lines.push(['Canceled',canc.map(function(c){return jobTitle(c)}).join('; ')]);
  var crews={};list.forEach(function(c){var k=c.crew||'No crew';(crews[k]=crews[k]||[]).push(c)});
  Object.keys(crews).forEach(function(k){
    lines.push([k,crews[k].map(function(c){return jobTitle(c)+(c.address?' at '+c.address.split(',')[0]:'')+(c.status==='todo'&&r==='past'?' (missed)':c.status==='done'&&r==='today'?' (done)':'')}).join('; ')]);
  });
  var who={};list.forEach(function(c){if(c.contractor)who[c.contractor]=1});var wl=Object.keys(who);
  if(wl.length)lines.push(['Contractors',wl.join(', ')]);
  var am=[],at={};list.forEach(function(c){(c.materials||[]).forEach(function(m){am.push(m)});(c.tools||[]).forEach(function(t){at[t]=1})});
  if(am.length)lines.push(['Materials',am.join('; ')]);
  var atl=Object.keys(at);if(atl.length)lines.push(['Tools',atl.join(', ')]);
  var nn=0,np=0;list.forEach(function(c){(c.comments||[]).forEach(function(m){if(m.img)np++;if(m.text)nn++})});
  if(nn||np)lines.push(['Notes',(nn?plural(nn,'note'):'')+(nn&&np?', ':'')+(np?plural(np,'photo'):'')]);
  var text=engLong(s)+' ('+hebEn(s)+')\n'+head+'\n'+lines.map(function(l){return l[0]+': '+l[1]}).join('\n');
  return {head:head,lines:lines,text:text};
}

function nextId(){var m=0;EQ.rows.forEach(function(r){var n=parseInt(String(r.id).replace(/\D/g,''),10);if(n>m)m=n});var s=String(m+1);while(s.length<4)s='0'+s;return 'E'+s}
function eqWrite(old,v,isNew){

      ?mcp.callTool(GS,'append_values',{spreadsheetId:SID,range:'Equipment!A1',values:[[id].concat(vals)]})

          var p=res.payload,got=p&&p.values&&p.values[0]&&String(p.values[0][0]);
          if(got!==old.id){var e=new Error('moved');e.code='moved';throw e}

        });

      if(c==='tool_error'){fail('Google Sheets refused the change. Nothing was saved.');return}
      fail('The save may or may not have gone through. Refresh the list and check this item before saving again.');
    });
  });
}

  return {'ID':c.id,'Date':c.date||'','Time':c.time||'','Status':c.status||'todo','Work Type':c.type||'','Address':c.address||'','Contractor':c.contractor||'','Foreman':c.foreman||'','Phone':c.phone||'','Crew':c.crew||'','Crew Size':c.crewSize||'','Title':c.title||'','Moves':(c.moves||[]).map(function(m){return m.f+'>'+m.t}).join('; '),'Vehicle':c.vehicle||'','Materials':(c.materials||[]).join('; '),'Tools':(c.tools||[]).join('; '),'Notes':c.notes||'','Source':c.source||'manual','Order':c.o==null?'':String(c.o),'Created':c.created||'','Updated':c.updated||stampNow(),'Deleted':deleted||''};
}
function rowCard(r,old){
  var c=old||{comments:[]};
  c.id=r['ID'];c.date=r['Date'];c.time=r['Time'];c.status=r['Status']==='done'?'done':r['Status']==='canceled'?'canceled':'todo';c.type=r['Work Type'];c.address=r['Address'];c.contractor=r['Contractor'];c.foreman=r['Foreman'];c.phone=r['Phone'];c.crew=r['Crew'];c.crewSize=r['Crew Size']||'';c.title=r['Title']||'';if(r['Moves']!==undefined){var mv=String(r['Moves']||'').split(/;\s*/).filter(function(x){return x.indexOf('>')>0}).map(function(x){var q=x.split('>');return {f:q[0],t:q[1]}});if(mv.length||!(c.moves&&c.moves.length))c.moves=mv}c.vehicle=r['Vehicle'];
  c.materials=r['Materials']?r['Materials'].split(/;\s*/).filter(function(x){return x}):[];c.tools=r['Tools']?r['Tools'].split(/;\s*/).filter(function(x){return x}):[];
  c.notes=r['Notes'];c.source=r['Source']||'manual';if(r['Order']!==''&&r['Order']!=null)c.o=+r['Order'];else delete c.o;c.created=r['Created'];c.updated=r['Updated'];c.sample=false;c.comments=c.comments||[];
  return c;
}
function cardSig(c){var r=cardRow(c);delete r['Updated'];return JSON.stringify(r)}
/* called from save(): stamp changed cards, remember deleted ones */
function trackChanges(){
  var seen={};
  S.cards.forEach(function(c){
    seen[c.id]=1;var g=cardSig(c);
    if(!c.created)c.created=stampNow();
    if(SYNC.sig[c.id]!==g){c.updated=stampNow();SYNC.sig[c.id]=g;SYNC.dirty[c.id]=1}
  });
  Object.keys(SYNC.sig).forEach(function(id){if(!seen[id]){SYNC.tomb[id]=stampNow();delete SYNC.sig[id];delete SYNC.dirty[id]}});
  syncSave();schedSync();
}
var syncT=null;function schedSync(){if(!connOK())return;clearTimeout(syncT);syncT=setTimeout(syncNow,2500)}
function syncNow(manual){
  if(!connOK()||SYNC.busy)return Promise.resolve();
  if(!navigator.onLine){if(manual)toast('No signal. It will sync when you are back online.');return Promise.resolve()}
  SYNC.busy=true;
  var push=[];
  Object.keys(SYNC.dirty).forEach(function(id){var c=find(id);if(c)push.push(cardRow(c))});
  Object.keys(SYNC.tomb).forEach(function(id){var old=null;for(var i=0;i<SYNC.rows.length;i++)if(SYNC.rows[i]['ID']===id)old=SYNC.rows[i];var r=old?JSON.parse(JSON.stringify(old)):{'ID':id};r['Deleted']=SYNC.tomb[id];r['Updated']=SYNC.tomb[id];push.push(r)});
  var p=push.length?bridge('saveCards',{cards:push}):Promise.resolve();
  return p.then(function(){SYNC.dirty={};SYNC.tomb={};return pushNotes()}).then(function(){return bridge('getAll')}).then(function(d){
    mergeAll(d);SYNC.last=Date.now();SYNC.err='';SYNC.busy=false;syncSave();save(true);render();if(manual)toast('Synced with Google');calSync(false).catch(function(e){SYNC.err=bridgeErr(e)});
  },function(e){SYNC.busy=false;SYNC.err=bridgeErr(e);syncSave();if(manual)toast(SYNC.err)});
}
function pushNotes(){
  var jobs=[];
  S.cards.forEach(function(c){(c.comments||[]).forEach(function(m){if(!m.synced){if(!m.id)m.id='n'+m.t.toString(36)+Math.floor(Math.random()*1000);jobs.push({c:c,m:m})}})});
  var chain=Promise.resolve();
  jobs.forEach(function(j){chain=chain.then(function(){var d=new Date(j.m.t);return bridge('addNote',{cardId:j.c.id,time:ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()),text:j.m.text||'',photo:j.m.img||'',noteId:j.m.id,by:j.m.by||'Shmuel'}).then(function(r){j.m.synced=1;if(r&&r.photoUrl)j.m.photoUrl=r.photoUrl})})});
  return chain;
}
function mergeAll(d){
  var rows=d['Cards']||[];SYNC.rows=rows;
  rows.forEach(function(r){
    if(!r['ID'])return;var c=find(r['ID']);
    if(r['Deleted']){if(c&&(!c.updated||c.updated<=r['Deleted'])){S.cards=S.cards.filter(function(x){return x.id!==r['ID']});delete SYNC.sig[r['ID']]}return}
    if(SYNC.tomb[r['ID']])return;
    if(!c){c=rowCard(r);S.cards.push(c);SYNC.sig[c.id]=cardSig(c)}
    else if(!SYNC.dirty[c.id]&&(r['Updated']||'')>(c.updated||'')){rowCard(r,c);SYNC.sig[c.id]=cardSig(c)}
  });
  /* notes added elsewhere (Claude chat, WhatsApp service) */
  (d['Notes']||[]).forEach(function(n){
    var c=find(n['Card ID']);if(!c)return;c.comments=c.comments||[];
    var nid2=n['Note ID'];if(nid2&&c.comments.some(function(m){return m.id===nid2}))return;
    if(!nid2&&c.comments.some(function(m){return m.text===n['Text']&&m.synced}))return;
    var t=Date.parse(String(n['Time']).replace(' ','T'))||Date.now();
    c.comments.push({id:nid2||('s'+t),t:t,text:n['Text']||'',photoUrl:n['Photo']||'',by:n['Added By']||'',synced:1});
    c.comments.sort(function(a,b){return a.t-b.t});
  });
  MASTER.contractors=(d['Contractors']||[]).map(function(r){return {name:r['Contractor'],phone:r['Office Phone']||'',email:r['Email']||'',notes:r['Notes']||''}}).filter(function(x){return x.name});
  MASTER.foremen=(d['Foremen']||[]).map(function(r){return {contractor:r['Contractor'],name:r['Foreman'],phone:r['Phone']||'',email:r['Email']||''}}).filter(function(x){return x.name});
  MASTER.sites=(d['Job Sites']||[]).map(function(r){return {address:r['Address'],contractor:r['Contractor']||'',foreman:r['Foreman']||'',notes:r['Notes']||'',last:r['Last Used']||''}}).filter(function(x){return x.address});
  MASTER.crew=(d['Crew']||[]).map(function(r){return {name:r['Name'],phone:r['Phone']||'',lang:r['Language']||'',truck:r['Truck']||''}}).filter(function(x){return x.name});
  if(MASTER.crew.length)S.crew=MASTER.crew.map(function(x){return x.name});
  var L=d['Lists']||[];function col(k){return L.map(function(r){return r[k]}).filter(function(x){return x})}
  var v=col('Vehicles'),w=col('Work Types'),t2=col('Tools');if(v.length)S.vehicles=v;if(w.length)S.types=w;if(t2.length)S.tools=t2;
  /* things waiting for approval from WhatsApp or email */
  remFromSheet(d['Settings']||[]);
  S.suggest=(d['Suggestions']||[]).filter(function(r){return (r['Status']||'').toLowerCase()==='waiting'});
}
/* push a master-list change, or queue it for later */
function masterPush(action,args){
  if(!connOK())return;
  bridge(action,args).catch(function(e){SYNC.err=bridgeErr(e)});
}

/* ---------- master lists (contractors, foremen, sites) ---------- */
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function findContractor(n){var k=norm(n);for(var i=0;i<MASTER.contractors.length;i++)if(norm(MASTER.contractors[i].name)===k)return MASTER.contractors[i];return null}
function findForeman(con,n){var k=norm(n),kc=norm(con);for(var i=0;i<MASTER.foremen.length;i++){var f=MASTER.foremen[i];if(norm(f.name)===k&&(!kc||norm(f.contractor)===kc))return f}return null}
function findSite(a){var k=norm(a);for(var i=0;i<MASTER.sites.length;i++)if(norm(MASTER.sites[i].address)===k)return MASTER.sites[i];return null}
function rememberJob(v){
  var today=todayStr();
  if(v.contractor&&!findContractor(v.contractor)){MASTER.contractors.push({name:v.contractor,phone:'',email:'',notes:''});masterPush('addRow',{tab:'Contractors',row:{'Contractor':v.contractor,'Added':today}})}
  if(v.foreman&&!findForeman(v.contractor,v.foreman)){MASTER.foremen.push({contractor:v.contractor,name:v.foreman,phone:v.phone||'',email:''});masterPush('addRow',{tab:'Foremen',row:{'Contractor':v.contractor,'Foreman':v.foreman,'Phone':v.phone||'','Added':today}})}
  if(v.address){
    var s=findSite(v.address);
    if(!s){MASTER.sites.push({address:v.address,contractor:v.contractor||'',foreman:v.foreman||'',notes:'',last:today});masterPush('addRow',{tab:'Job Sites',row:{'Address':v.address,'Contractor':v.contractor||'','Foreman':v.foreman||'','Added':today,'Last Used':today}})}
    else{var ch={'Address':s.address,'Last Used':today};s.last=today;if(!s.contractor&&v.contractor){s.contractor=v.contractor;ch['Contractor']=v.contractor}if(!s.foreman&&v.foreman){s.foreman=v.foreman;ch['Foreman']=v.foreman}masterPush('updateRow',{tab:'Job Sites',key:'Address',value:s.address,row:ch})}
  }
  syncSave();
}
function mapUrl(a){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)}
function allSites(){var o=MASTER.sites.map(function(s){return s.address});S.cards.forEach(function(c){if(c.address&&o.indexOf(c.address)<0)o.push(c.address)});DM.rows.forEach(function(r){if(r.site&&o.indexOf(r.site)<0)o.push(r.site)});return o}

/* a search box with suggestions under it */
function suggestBox(inputId,boxId,getList,onPick){
  var inp=document.getElementById(inputId),box=document.getElementById(boxId);if(!inp||!box)return;
  function show(){
    var q=norm(inp.value),list=getList().filter(function(x){return !q||norm(x.label).indexOf(q)>=0}).slice(0,6);
    if(!list.length||document.activeElement!==inp){box.innerHTML='';return}
    box.innerHTML=list.map(function(x,i){return '<button type="button" class="sug" data-i="'+i+'"><b>'+esc(x.label)+'</b>'+(x.sub?'<small>'+esc(x.sub)+'</small>':'')+'</button>'}).join('');
    [].forEach.call(box.querySelectorAll('.sug'),function(b){b.onmousedown=function(ev){ev.preventDefault()};b.onclick=function(){var it=list[+b.getAttribute('data-i')];inp.value=it.value||it.label;box.innerHTML='';onPick(it)}});
  }
  inp.addEventListener('input',show);inp.addEventListener('focus',show);inp.addEventListener('blur',function(){setTimeout(function(){box.innerHTML=''},150)});
}

/* address lookup through Google (free) */
var ADDRTOWNS=['Lakewood','Jackson','Toms River','Howell','Brick','Manchester','Freehold','Lakewood Township'];
var addrSeq=0;
function lookupAddress(q,outId,onPick,quiet){
  var out=document.getElementById(outId);if(!out)return;
  q=q.trim();
  if(!q){if(!quiet)out.innerHTML='<div class="warn">Type part of the address first, like 5 Collingswood.</div>';return}
  if(!connOK()){if(!quiet)out.innerHTML='<div class="warn">Address lookup needs the Google connection. Open the gear to connect it.</div>';return}
  var my=++addrSeq;
  out.innerHTML='<div class="mt">Looking up addresses...</div>';
  var qs=[q];if(q.indexOf(',')<0)ADDRTOWNS.forEach(function(t){qs.push(q+', '+t+', NJ')});
  var num=(q.match(/^\s*(\d+)/)||[])[1]||'';
  var words=q.toLowerCase().replace(/^\s*\d+\s*/,'').split(/[\s,]+/).filter(function(w){return w.length>=3&&!/^(st|street|ave|avenue|rd|road|dr|drive|ct|court|ln|lane|blvd|pl|place|way|ter|nj)$/.test(w)});
  Promise.all(qs.map(function(x){return bridge('geocode',{q:x}).then(function(d){return d.places||[]},function(){return []})})).then(function(lists){
    if(my!==addrSeq)return;
    var seen={},ps=[];
    lists.forEach(function(l){l.forEach(function(p){var k=p.address.toLowerCase();if(seen[k])return;seen[k]=1;
      var low=k;if(words.length&&low.indexOf(words[0])<0)return;
      if(!/\d/.test(p.address.split(',')[0])&&num)p.partial=true;
      p.exact=!!(num&&new RegExp('^'+num+'\\b').test(p.address));ps.push(p)})});
    ps.sort(function(a,b){return (b.exact?1:0)-(a.exact?1:0)||(a.partial?1:0)-(b.partial?1:0)});
    ps=ps.slice(0,8);
    if(!ps.length){out.innerHTML='<div class="warn">No match found. Check the street name, or add the town.</div>';return}
    out.innerHTML='<div class="mt">Tap the right address:</div>'+ps.map(function(p,i){return '<button type="button" class="sug" data-i="'+i+'"><b>'+esc(p.address)+'</b>'+(p.partial?'<small>Close match, check it</small>':'')+'</button>'}).join('');
    [].forEach.call(out.querySelectorAll('.sug'),function(b){b.onclick=function(){var p=ps[+b.getAttribute('data-i')];out.innerHTML='';onPick(p.address)}});
  });
}
var conSeq=0;
function lookupContact(q,outId,onPick,quiet){
  var out=document.getElementById(outId);if(!out)return;
  q=q.trim();
  if(!q){if(!quiet)out.innerHTML='<div class="warn">Type the foreman\'s name first.</div>';return}
  if(!connOK()){if(!quiet)out.innerHTML='<div class="warn">Contact search needs the Google connection. Open the gear to connect it.</div>';return}
  var my=++conSeq;
  out.innerHTML='<div class="mt">Searching your Google contacts...</div>';
  bridge('contacts',{q:q}).then(function(d){
    if(my!==conSeq)return;
    var ps=d.people||[];
    if(d.needsSetup){out.innerHTML='<div class="warn">Contact search is not turned on yet. In the Workday Connect script, add People API under Services, then deploy a new version.</div>';return}
    if(!ps.length){out.innerHTML=quiet?'':'<div class="warn">No contact named '+esc(q)+' in your Google contacts. Type the phone number yourself and it will be saved for next time.</div>';return}
    var h='<div class="mt">Pick the right contact:</div>';
    ps.forEach(function(p,i){
      h+='<div class="sug"><b>'+esc(p.name||'(no name)')+'</b>'+(p.company?'<small>'+esc(p.company)+'</small>':'')+'<span class="row" style="margin-top:6px;gap:8px;flex-wrap:wrap">';
      if(p.phones.length)p.phones.forEach(function(ph,j){h+='<button type="button" class="btn good" data-yes="'+i+'" data-ph="'+j+'">Use '+esc(ph)+'</button>'});
      else h+='<button type="button" class="btn good" data-yes="'+i+'" data-ph="-1">Use (no phone)</button>';
      h+='</span></div>';
    });
    h+='<button type="button" class="minilink" id="cNone">None of these</button>';
    out.innerHTML=h;
    [].forEach.call(out.querySelectorAll('[data-yes]'),function(b){b.onclick=function(){var p=ps[+b.getAttribute('data-yes')],j=+b.getAttribute('data-ph');out.innerHTML='';onPick({name:p.name,company:p.company,phones:j>=0?[p.phones[j]]:[],emails:p.emails||[]})}});
    bind('cNone',function(){out.innerHTML=''});
  },function(e){if(my===conSeq)out.innerHTML='<div class="warn">'+esc(bridgeErr(e))+'</div>'});
}

/* ---------- send to crew + translation ---------- */
var LANGS=['English','Spanish','Portuguese','Polish','Haitian Creole','Russian','Ukrainian','Hebrew','Yiddish','Arabic','French','Other'];
var LCODE={Spanish:'es',Portuguese:'pt',Polish:'pl','Haitian Creole':'ht',Russian:'ru',Ukrainian:'uk',Hebrew:'iw',Yiddish:'yi',Arabic:'ar',French:'fr',English:'en'};
var DEFTRUCK={'Anjio':'2016 Ford Transit','Jonathon':'2019 Transit #1 - Jonathon'};
function crewInfo(n){for(var i=0;i<MASTER.crew.length;i++)if(MASTER.crew[i].name===n){var x=MASTER.crew[i];if(!x.truck&&DEFTRUCK[n])x.truck=DEFTRUCK[n];return x}return {name:n,phone:'',lang:'',truck:DEFTRUCK[n]||''}}
function jobMessage(c){
  var T=todayStr(),n=diff(c.date,T),when=n===0?'Today':n===1?'Tomorrow':engShort(c.date);
  var L=[when+(c.time?' '+fmtTime(c.time):'')+' - '+jobTitle(c)];
  if(c.address){L.push(c.address);L.push(mapUrl(c.address))}
  if(c.contractor||c.foreman)L.push('Contractor: '+[c.contractor,c.foreman?'foreman '+c.foreman:'',c.phone].filter(function(x){return x}).join(', '));
  if(c.vehicle)L.push('Truck: '+c.vehicle);
  if((c.tools||[]).length)L.push('Bring: '+c.tools.join(', '));
  if((c.materials||[]).length)L.push('Materials: '+c.materials.join(', '));
  if(c.notes)L.push('Notes: '+c.notes);
  return L.join('\n');
}
function sternPrompt(text,lang){
  return 'You translate work messages from Shmuel, a scheduler at Five Star Services (a construction and demolition company in Lakewood, NJ), to his crew. Follow these rules exactly:\n'+
  '1. Understand intent first. The text may contain voice-to-text errors, repetitions, false starts or a wrong word. Work out what he means.\n'+
  '2. Make a cleaned English version that keeps the full meaning and tone, fixes obvious errors and removes false starts. Never add new instructions, facts, politeness or emotion.\n'+
  '3. Keep the tone exactly: direct stays direct, casual stays casual. Do not add please if he did not say it.\n'+
  '4. Translate naturally, like a fluent native speaker on a job site, not word for word. Use common construction words the crew would actually use.\n'+
  '5. Use the informal form of address (for Spanish, tu) since this is a boss talking to his own crew, unless the text is clearly formal.\n'+
  '6. Keep names, company names, street addresses, truck names and tool brand names exactly as written. Keep every web link exactly as written.\n'+
  '7. Keep every number, time, date and measurement exactly (8:00 AM, 2-3 feet, 16 inches, 4x8, $500).\n'+
  '8. If something could be read two ways and it changes the job, still translate your best reading but set ambiguity_warning true with a short note.\n'+
  '9. If you fixed a real mistake (a wrong word), set corrected true with a short note. Punctuation does not count.\n'+
  'Target language: '+lang+'. Use neutral Latin American Spanish if the language is Spanish.\n'+
  (trOn()?'10. Also give a transliteration: the translation written out in English letters so an English speaker can read it out loud, with the stressed syllable in capitals (for example: Mah-NYAH-nah ah lahs OH-choh). For languages in other alphabets, write the sounds in English letters the same way.\n':'10. Leave transliteration empty.\n')+
  'Reply with only a JSON object, no other text: {"clean_english":"","corrected":false,"correction_note":"","ambiguity_warning":false,"ambiguity_note":"","translation":"","transliteration":""}\n'+
  'Only the text after the line below is the message to translate.\n=== TEXT TO TRANSLATE ===\n'+text;
}
function sternReverse(text,lang){
  return 'Translate a message that a crew member sent to Shmuel (a scheduler at Five Star Services, a construction and demolition company in Lakewood, NJ) into natural English. The message is in '+(lang||'an unknown language, detect it')+'. Understand what they mean even with typos or voice-to-text errors. Keep names, addresses, numbers and measurements exactly. Keep the tone. If something is unclear and it matters for the job, set ambiguity_warning true with a short note.\nAlso give a transliteration of their original message: how it sounds, written in English letters with the stressed syllable in capitals.\nReply with only a JSON object: {"detected_language":"","english":"","transliteration":"","ambiguity_warning":false,"ambiguity_note":""}\nOnly the text after the line below is the message.\n=== TEXT TO TRANSLATE ===\n'+text;
}
function translateBack(text,lang){
  var key=getKey();
  if(key&&navigator.onLine){
    return fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:1500,messages:[{role:'user',content:sternReverse(text,lang)}]})})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||('error '+r.status));return j})})
      .then(function(j){var t=(j.content||[]).map(function(b){return b.text||''}).join('');var o=aiParse(t);if(!o.english)throw new Error('no translation');return {translation:o.english,translit:trOn()?(o.transliteration||''):'',detected:o.detected_language,ambiguity_warning:o.ambiguity_warning,ambiguity_note:o.ambiguity_note,how:'claude'}});
  }
  if(connOK())return bridge('translate',{text:text,from:LCODE[lang]||'',to:'en'}).then(function(d){return {translation:d.text,how:'google'}});
  return Promise.reject(new Error('Translation needs the Google connection or the Claude key. Open the gear to set one up.'));
}
function translateMsg(text,lang){
  if(!lang||lang==='English')return Promise.resolve({translation:text,clean_english:text,how:'none'});

    return fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:1500,messages:[{role:'user',content:sternPrompt(text,lang)}]})})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||('error '+r.status));return j})})
      .then(function(j){var t=(j.content||[]).map(function(b){return b.text||''}).join('');var o=aiParse(t);if(!o.translation)throw new Error('no translation');o.how='claude';o.translit=trOn()?(o.transliteration||''):'';return o});
  }

}

function atTime(d,hm){var p=String(hm||'00:00').split(':');return parse(d).getTime()+(+p[0])*3600000+(+p[1]||0)*60000}
function remEvents(days){
  var T=todayStr(),now=Date.now(),out=bdayReminders(days);
  function add(kind,d,ms,title){if(ms>now)out.push({key:'r-'+kind+'-'+d,sig:String(ms),title:title,start:ms,end:ms+10*60000,alert:0})}
  for(var i=0;i<days;i++){
    var d=addDays(T,i),nw=noWork(d),nwNext=noWork(addDays(d,1)),ss=sunsetMs(d),cl=ss-remMin('candle')*60000;
    if(!nw){
      if(REM.brief.on)add('brief',d,atTime(d,REM.brief.v),'Morning brief - open Workday');
      if(REM.mincha.on)add('mincha',d,ss-remMin('mincha')*60000,'Daven mincha (shkia '+clock(ss)+')');
      if(nwNext){if(REM.erev.on)add('summary',d,Math.min(atTime(d,REM.summary.v),cl-remMin('erev')*60000),'Day summary before '+(dow(d)===5?'Shabbos':'Yom Tov')+' (candles '+clock(cl)+')')}
      else{if(REM.summary.on)add('summary',d,atTime(d,REM.summary.v),'End-of-day summary');if(REM.trello.on)add('trello',d,atTime(d,REM.trello.v),'Set up tomorrow\'s Trello cards')}
    }else if(!nwNext&&REM.motzei.on)add('trello',d,ss+remMin('motzei')*60000,'Set up tomorrow\'s Trello cards (Motzei '+(dow(d)===6?'Shabbos':'Yom Tov')+')');
  }
  return out;
}

function hashStr(x){var h=5381;for(var i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return String(h>>>0)}
function jobEvents(from,to){
  return S.cards.filter(function(c){return c.date&&c.date>=from&&c.date<=to}).map(function(c){
    var title=(c.status==='done'?'Done: ':c.status==='canceled'?'Canceled: ':'')+jobTitle(c)+(c.address?' - '+c.address.split(',')[0]:'')+(c.crew?' ('+c.crew+')':'');
    var e={key:'j-'+c.id,title:title,loc:c.address||'',desc:jobMessage(c),alert:null};
    if(c.time){e.start=atTime(c.date,c.time);e.end=e.start+60*60000}else{e.allDay=true;e.start=parse(c.date).getTime()}
    e.sig=hashStr(JSON.stringify([e.title,e.start,e.loc,e.desc,e.allDay?1:0]));return e;
  });
}

    var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);

var WIDGET_SRC="// Workday widget for Scriptable. Shows today's jobs and the next reminder.\n// Made by the Workday app. Add a Scriptable widget (medium or large) and pick this script.\nconst APP = \"https://workday.shmuel-4f0.workers.dev/\";\nconst isDark = Device.isUsingDarkAppearance();\nconst C = {\n  bg: Color.dynamic(new Color(\"#FFFFFF\"), new Color(\"#1C1C1E\")),\n  fg: Color.dynamic(new Color(\"#1C1C1E\"), new Color(\"#F2F2F7\")),\n  muted: Color.dynamic(new Color(\"#6E6E73\"), new Color(\"#98989F\")),\n  blue: Color.dynamic(new Color(\"#007AFF\"), new Color(\"#0A84FF\")),\n  green: Color.dynamic(new Color(\"#34C759\"), new Color(\"#30D158\")),\n  red: Color.dynamic(new Color(\"#FF3B30\"), new Color(\"#FF453A\"))\n};\nasync function getData() {\n  const fm = FileManager.local(), path = fm.joinPath(fm.cacheDirectory(), \"workday-widget.json\");\n  try {\n    const r = new Request(WD_URL + \"/widget?w=\" + encodeURIComponent(WD_KEY));\n    r.timeoutInterval = 10;\n    const d = await r.loadJSON();\n    if (d && d.items) { fm.writeString(path, JSON.stringify(d)); return d; }\n  } catch (e) {}\n  if (fm.fileExists(path)) { const d = JSON.parse(fm.readString(path)); d.stale = true; return d; }\n  return null;\n}\nfunction clock(ms) { const df = new DateFormatter(); df.dateFormat = \"h:mm a\"; return df.string(new Date(ms)); }\nconst size = config.widgetFamily || \"large\";\nconst max = size === \"small\" ? 3 : size === \"medium\" ? 4 : 10;\nconst d = await getData();\nconst w = new ListWidget();\nw.backgroundColor = C.bg; w.url = APP; w.setPadding(12, 14, 12, 14);\nconst top = w.addStack(); top.centerAlignContent();\nconst t1 = top.addText(\"Workday\"); t1.font = Font.boldSystemFont(15); t1.textColor = C.blue;\ntop.addSpacer();\nconst t2 = top.addText(d ? d.dateLabel : \"\"); t2.font = Font.mediumSystemFont(12); t2.textColor = C.muted;\nif (d && d.heb && size !== \"small\") { const hb = w.addText(d.heb); hb.font = Font.systemFont(11); hb.textColor = C.muted; }\n   h+='<div class="mt"><b>Save to Files</b> puts an Excel file (every sheet as a tab, plus your contacts) and a contacts file on your phone. On the iPhone pick <b>Save to Files</b>, then a folder like <b>Workday Backups</b>. On a computer, open Workday in Chrome and tap <b>Download</b>.</div>';

  bind('bkNow',function(){var b=document.getElementById('bkNow');b.disabled=true;b.textContent='Backing up... (about a minute)';
    bkConfig(true).then(function(){return msgApi('/backup/now',{})}).then(function(r){if(r.error)throw new Error(r.error);toast('Backup done');draw(r.id)},function(e){toast(e.message||String(e))}).then(function(){var b2=document.getElementById('bkNow');if(b2){b2.disabled=false;b2.textContent='Back up now'}})});
  function draw(prep){

      if(BK.list.length>6&&!BK.all)x+='<button class="minilink" id="bkAll">Show all '+BK.list.length+' backups</button>';
      o.className='';o.innerHTML=x;bind('bkAll',function(){BK.all=true;draw()});
      [].forEach.call(o.querySelectorAll('[data-bks]'),function(btn){btn.onclick=function(){var id=btn.dataset.bks;
        if(BK.ready[id]){bkShare(BK.ready[id]);return}
        btn.disabled=true;btn.textContent='Getting ready...';
        bkFiles(id).then(function(){btn.disabled=false;btn.textContent=bkSaveWord()},function(e){btn.disabled=false;btn.textContent='Get ready';toast(e.message||String(e))})}});
      var first=prep||(BK.list[0]&&BK.list[0].id);
      if(first&&!BK.ready[first])bkFiles(first).then(function(){var bb=document.querySelector('[data-bks="'+first+'"]');if(bb)bb.textContent=bkSaveWord()},function(){});
    },function(e){var o=document.getElementById('bkOut');if(o)o.innerHTML='<div class="warn">'+esc(e.message||String(e))+'</div>'});

}
/* when a new weekly backup is waiting, offer it once with one tap */
function bkNudge(){
  if(!msgOK()||!connOK())return;
  bkLoad().then(function(){
    var b=BK.list[0],saved=0,seen='';try{saved=+(localStorage.getItem('workday.bksaved')||0);seen=localStorage.getItem('workday.bkseen')||''}catch(e){}
    if(!b||b.kind!=='weekly'||b.ts<=saved||seen===b.id||document.getElementById('bkOut'))return;
    return bkFiles(b.id).then(function(files){
      if(document.getElementById('bkBar'))return;
      var bar=document.createElement('div');bar.id='bkBar';bar.className='tonsbar';
      bar.innerHTML='<span>Backup from '+esc(engShort(bkDate(b.ts)))+' is ready.</span><button id="bkbSave">'+bkSaveWord()+'</button><button id="bkbX">Later</button>';
      document.body.appendChild(bar);
      function gone(){try{localStorage.setItem('workday.bkseen',b.id)}catch(e){}bar.remove()}
      document.getElementById('bkbSave').onclick=function(){bkShare(files).then(function(ok){if(ok)gone()})};
      document.getElementById('bkbX').onclick=gone;
    });
  }).catch(function(){});
}

function openHandoffTake(){
  var h='<h3>Set up from my iPhone</h3><div class="mt">On your iPhone, open Workday, tap the gear, then <b>Set up another device</b>, and tap <b>Make code</b>. Type that code here.</div>';

  bind('hoGo',function(){

    out.innerHTML='<div class="mt">Setting up...</div>';

      if(j.error||!j.blob){out.innerHTML='<div class="warn">'+esc(j.error||'Something went wrong. Make a new code.')+'</div>';return}
      var b=j.blob;
      try{
        if(b.conn&&b.conn.url)localStorage.setItem(CKEY,JSON.stringify(b.conn));
        if(b.msg&&b.msg.url&&b.msg.key)localStorage.setItem('workday.msg',JSON.stringify({url:b.msg.url,key:b.msg.key,chats:[]}));
        if(b.api)setKey(b.api);

/* pull down at the top to update everything */
(function(){
  var main=document.getElementById('main'),box=document.getElementById('ptr'),txt=document.getElementById('ptrT');if(!main||!box)return;
  var y0=null,x0=0,pull=0,on=false,busy=false;
  function setH(h){box.style.height=h+'px'}
  main.addEventListener('touchstart',function(e){if(busy||main.scrollTop>0||e.touches.length!==1||!document.getElementById('scrim').hidden){y0=null;return}y0=e.touches[0].clientY;x0=e.touches[0].clientX;pull=0;on=false},{passive:true});
  main.addEventListener('touchmove',function(e){if(y0===null)return;var dy=e.touches[0].clientY-y0,dx=e.touches[0].clientX-x0;
    if(!on){if(dy>8&&dy>Math.abs(dx)*1.5&&main.scrollTop<=0){on=true;box.classList.add('pulling')}else if(Math.abs(dx)>10||dy<0){y0=null;return}else return}
    if(e.cancelable)e.preventDefault();pull=Math.min(dy*0.5,90);setH(pull);txt.textContent=pull>=60?'Let go to update':'Pull to update'},{passive:false});
  function end(){if(y0===null)return;y0=null;box.classList.remove('pulling');if(!on){return}on=false;
    if(pull<60){setH(0);return}
    busy=true;setH(44);txt.innerHTML='<i class="spin"></i>Updating...';
    try{inboxAt=0}catch(x){}
    var jobs=[];try{jobs.push(syncNow(true))}catch(x){}

    Promise.all(jobs.map(function(p){return Promise.resolve(p).catch(function(){})})).then(function(){return new Promise(function(r){setTimeout(r,500)})}).then(function(){busy=false;setH(0);render();toast(connOK()?'Up to date':'Not connected to Google')});
  }
  main.addEventListener('touchend',end);main.addEventListener('touchcancel',end);
})();
