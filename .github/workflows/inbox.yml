name: Workday inbox
# Claude uses this to drop sealed, signed items into the Workday app.
# The drop is encrypted for the messages service; only the service can open it.
on:
  workflow_dispatch:
    inputs:
      drop:
        description: Sealed drop (leave empty to just print the inbox key)
        required: false
        default: ''
jobs:
  drop:
    runs-on: ubuntu-latest
    env:
      URL: https://workday-messages.shmuel-4f0.workers.dev
      DROP: ${{ inputs.drop }}
    steps:
      - name: Inbox key
        run: echo "::notice title=inbox-key::$(curl -sS "$URL/inbox-key")"
      - name: Deliver
        if: inputs.drop != ''
        run: |
          printf '%s' "$DROP" > drop.json
          echo "::notice title=drop::$(curl -sS -X POST -H 'Content-Type: application/json' --data-binary @drop.json "$URL/drop")"
