name: Deploy app
on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'icons/**', 'app/**', '.github/workflows/deploy-app.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the app files
        run: |
          mkdir -p dist
          cp index.html sw.js manifest.webmanifest dist/
          cp -r icons dist/icons
          printf '/sw.js\n  Cache-Control: no-cache\n/index.html\n  Cache-Control: no-cache\n/\n  Cache-Control: no-cache\n' > dist/_headers
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: app
          wranglerVersion: "4"
      - name: Check it is live
        run: |
          sleep 5
          echo "::notice title=app-check::$(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://workday.shmuel-4f0.workers.dev/) sw:$(curl -s -o /dev/null -w '%{http_code}' https://workday.shmuel-4f0.workers.dev/sw.js) icon:$(curl -s -o /dev/null -w '%{http_code}' https://workday.shmuel-4f0.workers.dev/icons/icon-192.png) ver:$(curl -s https://workday.shmuel-4f0.workers.dev/ | grep -o "APPVER='[^']*'")"
